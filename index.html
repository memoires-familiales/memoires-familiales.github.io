
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mémoires familiales</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f0e7;
            color: #453326;
            font-family: Georgia, serif;
            text-align: center;
        }
        main {
            max-width: 600px;
            padding: 40px 25px;
        }
        h1 { font-size: 40px; font-weight: normal; }
        p { font-size: 18px; line-height: 1.7; }
        hr {
            width: 60px;
            border: 0;
            border-top: 1px solid #947657;
            margin: 30px auto;
        }
        .subtitle {
            font-style: italic;
            color: #82715d;
        }
        footer {
            margin-top: 50px;
            font-size: 13px;
            color: #82715d;
        }
    </style>
</head>
<body>
    <main>
        <h1>Mémoires familiales</h1>
        <p class="subtitle">
            Préserver notre histoire, transmettre nos souvenirs.
        </p>
        <hr>
        <p>Notre espace numérique familial est en préparation.</p>
        <p>Retrouvez prochainement nos récits, photographies,
        archives et projets de mémoire.</p>
        <footer>Un héritage pour les générations futures.</footer>
    </main>
</body>
</html>
