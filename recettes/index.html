<main class="page recettes">

  <div class="filtres-recettes" id="filtres-recettes" role="search" aria-label="Rechercher et filtrer les recettes">

      <input id="q-recettes" type="search" placeholder="Titre, ingrédient, nom ou surnom…" autocomplete="off">

    <label for="type-recettes">Catégorie
      <select id="type-recettes"><option value="">Toutes les catégories</option></select>
    </label>
    <label for="personne-recettes">Personne
      <select id="personne-recettes"><option value="">Toutes les attributions</option></select>
    </label>
    <label for="etat-recettes">Afficher
      <select id="etat-recettes">
        <option value="cuisiner">Fiches avec ingrédients et préparation</option>
        <option value="tout">Toutes les recettes repérées</option>
        <option value="completer">Fiches à compléter</option>
      </select>
    </label>
  </div>
  <p id="compte-recettes" class="recettes__compte" role="status"></p>
  <div id="liste-recettes"></div>
</main>
